# Walkcode host settings for tmux (Linux/macOS) and psmux (Windows).
# Installed to ~/.config/walkcode/tmux.conf and sourced from ~/.tmux.conf.

# Let agent notifications / progress / clipboard escapes reach the attached
# Walkcode terminal (in-app banners while a session is open).
set -g allow-passthrough on

# psmux ignores program-set pane titles unless this is on (tmux allows them by
# default and doesn't know the option, hence -q).
set -gq allow-set-title on

# Count bells per window so Walkcode can detect "needs attention" by polling,
# even when a client is attached and viewing the window.
set-hook -g alert-bell 'set -wF @wc_bell "#{e|+:#{?@wc_bell,#{@wc_bell},0},1}"'
