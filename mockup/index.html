<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walkcode — Mockup</title>
<style>
  :root{--bg:#0b0f14;--panel:#121820;--panel2:#0e141b;--line:#1e2733;
        --fg:#e6edf3;--mut:#8b98a5;--accent:#3ddc84;--warn:#ffb020;--term:#0a0e13;
        --blue:#6aa9ff;}
  *{box-sizing:border-box}
  body{margin:0;background:#05080c;color:var(--fg);
       font:14px/1.4 -apple-system,Roboto,"Segoe UI",sans-serif;padding:32px}
  h1{font-size:18px;font-weight:600;margin:0 0 4px}
  .sub{color:var(--mut);margin-bottom:24px;max-width:760px}
  .stage{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
  .phone{width:300px;margin:0;background:var(--bg);border:1px solid var(--line);
         border-radius:28px;padding:10px;box-shadow:0 12px 40px #0008}
  .cap{color:var(--mut);font-size:12px;margin:0 0 8px 4px}
  .screen{background:var(--panel2);border-radius:20px;overflow:hidden;height:640px;
          display:flex;flex-direction:column}
  .status{display:flex;justify-content:space-between;padding:6px 14px;font-size:11px;
          color:var(--mut)}
  .bar{display:flex;align-items:center;justify-content:space-between;
       padding:12px 14px;background:var(--panel);border-bottom:1px solid var(--line);
       font-weight:600}
  .bar .act{color:var(--accent);font-weight:600}
  .bar .mut{color:var(--mut);font-weight:400}
  .list{flex:1;overflow:auto;padding:8px}
  .row{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px}
  .row+.row{margin-top:4px}
  .row:hover{background:#ffffff08}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .on{background:var(--accent)} .off{background:#4a5765} .idle{background:var(--warn)}
  .row .t{flex:1;min-width:0}
  .row .t b{display:block;font-weight:600}
  .row .t span{color:var(--mut);font-size:12px;display:block;
               overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .t span.path{color:var(--blue)}
  .row .t span.ok{color:var(--accent)}
  .pill{font-size:11px;color:var(--mut);border:1px solid var(--line);
        border-radius:999px;padding:3px 8px;white-space:nowrap}
  .pill.hot{color:var(--warn);border-color:#4a3a12}
  .pill.on{color:var(--accent);border-color:#1d4a33}
  .sect{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;
        padding:12px 14px 4px}
  .pcard{margin:8px;padding:14px;border-radius:14px;background:var(--panel);
         border:1px solid var(--line)}
  .pcard b{font-size:15px}
  .pcard .meta{color:var(--mut);font-size:12px;margin-top:4px}
  .hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .badge{display:inline-flex;min-width:20px;height:20px;padding:0 6px;border-radius:10px;
         background:var(--accent);color:#04120a;font-size:11px;font-weight:700;
         align-items:center;justify-content:center;flex:none}
  .badge.dim{background:#243040;color:var(--fg)}
  .unread{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
  .hdr{padding:8px 14px 10px;background:var(--panel2);border-bottom:1px solid var(--line)}
  .hdr .c{color:var(--mut);font-size:12px}
  .hdr .c .p{color:var(--blue)}
  .wrap{flex:1;position:relative;display:flex;flex-direction:column;min-height:0}
  .term{flex:1;background:var(--term);padding:12px;font:12.5px/1.5 "SF Mono",Consolas,monospace;
        overflow:auto}
  .term .p{color:var(--accent)} .term .d{color:var(--mut)}
  .term.cached{color:#6b7886}
  .banner{position:absolute;left:0;right:0;bottom:0;background:var(--panel2);
          border-top:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--fg)}
  .banner span{color:var(--mut);font-size:12px;display:block}
  .cursor{display:inline-block;width:8px;height:14px;background:var(--accent);
          vertical-align:-2px;animation:b 1s steps(1) infinite}
  @keyframes b{50%{opacity:0}}
  .walk{display:flex;gap:6px;padding:8px 8px 0;background:var(--panel)}
  .walk .key{flex:1;text-align:center}
  .walk .key.on{color:var(--accent);border-color:#1d4a33}
  .keys{display:flex;gap:6px;padding:8px;background:var(--panel);
        border-top:1px solid var(--line);overflow:auto}
  .key{flex:none;background:#1b232e;border:1px solid var(--line);border-radius:8px;
       padding:8px 10px;font-size:12px}
  .field{padding:10px 12px;border-radius:10px;background:var(--panel);margin:6px 0;
         display:flex;justify-content:space-between;gap:12px}
  .field span{color:var(--mut)} .field b{font-weight:500}
  .field .v{color:var(--blue);font-weight:500}
  .res{margin:4px 14px 8px;font-size:12px;color:var(--accent)}
  .res.bad{color:var(--warn)}
  .mono{font-family:"SF Mono",Consolas,monospace;font-size:11px;color:var(--blue)}
  .sw{width:34px;height:20px;border-radius:999px;background:#2a3644;position:relative;flex:none}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#8b98a5}
  .sw.on{background:#1d4a33}
  .sw.on::after{left:16px;background:var(--accent)}
  .btn{margin:14px;background:var(--accent);color:#04120a;border-radius:12px;
       text-align:center;padding:12px;font-weight:700}
  .ghost{background:#121820;border:1px dashed #2a3644;color:var(--accent)}
  .nav{display:flex;border-top:1px solid var(--line);background:var(--panel)}
  .nav div{flex:1;text-align:center;padding:10px;font-size:12px;color:var(--mut)}
  .nav div.sel{color:var(--accent);font-weight:600}
  .notif{padding:12px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
  .notif+.notif{margin-top:10px}
  .notif .top{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  .notif .app{font-weight:600;margin:6px 0 2px}
  .notif .msg{color:var(--fg)}
  .pad{padding:10px}
</style>
</head>
<body>
  <h1>Walkcode — clickable mockup v4</h1>
  <div class="sub">Projects → Workspaces → Sessions, Hosts (with the phone-key setup), Settings
    (voice, backup), the terminal including the cached screen while reconnecting, and the
    alerts. Matches the app as of 2026-10-21. Static; hover states only.</div>

  <div class="stage">

    <!-- Projects -->
    <figure class="phone">
      <figcaption class="cap">Projects</figcaption>
      <div class="screen">
        <div class="status"><span>9:41</span><span>◗◗ ◗ ▮</span></div>
        <div class="bar"><span>Projects</span><span class="act">+</span></div>
        <div class="list">
          <div class="pcard">
            <div class="hd"><b>Personal</b><span class="badge">1</span></div>
            <div class="meta">1 workspace · hermes · home-server</div>
          </div>
          <div class="pcard">
            <div class="hd"><b>Work</b><span class="badge">2</span></div>
            <div class="meta">3 workspaces · claude, opencode · 2 hosts</div>
          </div>
        </div>
        <div class="nav"><div class="sel">Projects &nbsp;<span class="badge">3</span></div><div>Hosts</div><div>Settings</div></div>
      </div>
    </figure>

    <!-- Project detail -->
    <figure class="phone">
      <figcaption class="cap">Project detail</figcaption>
      <div class="screen">
        <div class="status"><span>9:41</span><span>◗◗ ◗ ▮</span></div>
        <div class="bar"><span class="mut">← Work</span><span class="act">+ &nbsp; ✎ &nbsp; ✕</span></div>
        <div class="list">
          <div class="row"><i class="dot on"></i>
            <div class="t"><b>TollBff</b><span>home-server · claude · 2 sessions</span>
              <span class="path">~/src/tollbff</span></div>
            <span class="badge">2</span></div>
          <div class="row"><i class="dot off"></i>
            <div class="t"><b>DMBff</b><span>home-server · claude · no sessions</span>
              <span class="path">~/src/dmbff</span></div></div>
          <div class="row"><i class="dot on"></i>
            <div class="t"><b>IaC &amp; GW</b><span>build-box · opencode · 1 session</span>
              <span class="path">~/infra/gw</span></div>
            <span class="unread"></span></div>
        </div>
      </div>
    </figure>

    <!-- Workspace sessions -->
    <figure class="phone">
      <figcaption class="cap">Workspace: sessions</figcaption>
      <div class="screen">
        <div class="status"><span>9:41</span><span>◗◗ ◗ ▮</span></div>
        <div class="bar"><span class="mut">← Work / TollBff</span><span class="act">↻ &nbsp; ✎</span></div>
        <div class="hdr"><div class="c">home-server · <span class="p">~/src/tollbff</span> · claude</div></div>
        <div class="list">
          <div class="row"><i class="dot on"></i>
            <div class="t"><b>Refactor auth</b><span>active · quiet 3s · 2 new</span></div>
            <span class="unread"></span>
            <span class="pill hot">🔔</span></div>
          <div class="row"><i class="dot idle"></i>
            <div class="t"><b>Fix flaky test</b><span>quiet 42s · may be waiting</span></div>
            <span class="pill hot">🔔</span></div>
          <div class="row"><i class="dot off"></i>
            <div class="t"><b>#3</b><span>stopped</span></div>
            <span class="pill">▶</span></div>
        </div>
        <div class="btn ghost">+ New session</div>
      </div>
    </figure>

    <!-- Terminal, live -->
    <figure class="phone">
      <figcaption class="cap">Terminal (live)</figcaption>
      <div class="screen">
        <div class="status"><span>9:41</span><span>◗◗ ◗ ▮</span></div>
        <div class="bar"><span class="mut">← TollBff / Refactor auth</span><span class="act">⋮</span></div>
        <div class="hdr"><div class="c">home-server · <span class="p">~/src/tollbff</span> · claude</div></div>
        <div class="wrap">
          <div class="term">
            <div><span class="p">$</span> claude</div>
            <div>&nbsp;</div>
            <div>&gt; refactor the auth module</div>
            <div class="d">● Reading src/auth.ts …</div>
            <div class="d">● Waiting for approval?</div>
            <div>&nbsp;</div>
            <div><span class="p">❯</span> <span class="cursor"></span></div>
          </div>
        </div>
        <div class="walk">
          <div class="key on">Walk: on</div><div class="key">Dictate</div><div class="key">Hush</div>
        </div>
        <div class="keys">
          <div class="key">^C</div><div class="key">Esc</div><div class="key">Tab</div>
          <div class="key">←</div><div class="key">↑</div><div class="key">↓</div>
          <div class="key">→</div><div class="key">⏎</div>
        </div>
      </div>
    </figure>

    <!-- Terminal, reconnecting with cached screen -->
    <figure class="phone">
      <figcaption class="cap">Terminal (reconnecting, cached screen)</figcaption>
      <div class="screen">
        <div class="status"><span>9:41</span><span>◗◗ ◗ ▮</span></div>
        <div class="bar"><span class="mut">← TollBff / Refactor auth</span><span class="act">⋮</span></div>
        <div class="hdr"><div class="c">home-server · <span class="p">~/src/tollbff</span> · claude</div></div>
        <div class="wrap">
          <div class="term cached">
            <div><span class="p">$</span> claude</div>
            <div>&nbsp;</div>
            <div>&gt; refactor the auth module</div>
            <div>● Reading src/auth.ts …</div>
            <div>● Waiting for approval?</div>
          </div>
          <div class="banner">Connecting to home-server…<span>Last screen from this session, read-only until attached</span></div>
        </div>
        <div class="walk">
          <div class="key">Walk: off</div><div class="key">Dictate</div><div class="key">Hush</div>
        </div>
        <div class="keys">
          <div class="key">^C</div><div class="key">Esc</div><div class="key">Tab</div>
          <div class="key">←</div><div class="key">↑</div><div class="key">↓</div>
          <div class="key">→</div><div class="key">⏎</div>
        </div>
      </div>
    </figure>

    <!-- Hosts -->
    <figure class="phone">
      <figcaption class="cap">Hosts</figcaption>
      <div class="screen">
        <div class="status"><span>9:41</span><span>◗◗ ◗ ▮</span></div>
        <div class="bar"><span>Hosts</span><span class="act">+</span></div>
        <div class="list">
          <div class="row"><i class="dot on"></i><div class="t">
            <b>home-server</b><span>watching · 100.84.2.11 · 3 workspaces</span></div></div>
          <div class="row"><i class="dot on"></i><div class="t">
            <b>dev-laptop</b><span>watching · dev.local · 1 workspace</span></div></div>
          <div class="row"><i class="dot off"></i><div class="t">
            <b>build-box</b><span>not connected yet · 1 workspace</span></div></div>
          <div class="sect">Device key</div>
          <div class="row"><div class="t"><b>Ed25519 · generated on device</b>
            <span class="mono">ssh-ed25519 AAAAC3…Lr walkcode@android</span></div>
            <span class="pill">Copy pubkey</span></div>
        </div>
        <div class="nav"><div>Projects</div><div class="sel">Hosts</div><div>Settings</div></div>
      </div>
    </figure>

    <!-- Host editor -->
    <figure class="phone">
      <figcaption class="cap">Host editor (phone key)</figcaption>
      <div class="screen">
        <div class="status"><span>9:41</span><span>◗◗ ◗ ▮</span></div>
        <div class="bar"><span class="mut">← Edit host</span><span></span></div>
        <div class="list">
          <div class="field"><span>Name</span><b>home-server</b></div>
          <div class="field"><span>User</span><b>dev</b></div>
          <div class="field"><span>Port</span><b>22</b></div>
          <div class="field"><span>LAN address</span><span class="v">dev.local</span></div>
          <div class="field"><span>Tailnet address</span><span class="v">100.84.2.11</span></div>
          <div class="field"><span>Multiplexer</span><b>tmux (Linux / macOS) ▾</b></div>
          <div class="sect">Phone key</div>
          <div class="row"><div class="t"><b>Authorize command</b>
            <span>Paste into a shell on the host</span></div><span class="pill">Copy</span></div>
          <div class="btn ghost" style="margin:8px 6px">Test connection</div>
          <div class="res">Connected via dev.local. This phone is authorized.</div>
          <div class="sect">Host key</div>
          <div class="res mono" style="color:var(--blue)">SHA256:tzXmYcHb8arKxxAEojuYCHUg6q4ZlIZIT9PiZGjLIkY</div>
          <div class="btn" style="margin:8px 6px">Save</div>
          <div class="btn ghost" style="margin:4px 6px 8px">Delete host</div>
        </div>
      </div>
    </figure>

    <!-- Settings -->
    <figure class="phone">
      <figcaption class="cap">Settings</figcaption>
      <div class="screen">
        <div class="status"><span>9:41</span><span>◗◗ ◗ ▮</span></div>
        <div class="bar"><span>Settings</span><span></span></div>
        <div class="list">
          <div class="sect">Alerts</div>
          <div class="row"><div class="t"><b>Quiet alerts</b>
            <span>Notify when a watched session has unread output and goes silent</span></div><i class="sw on"></i></div>
          <div class="pad" style="padding:4px 14px 8px;display:flex;gap:6px;flex-wrap:wrap">
            <span class="pill">5s</span><span class="pill">10s</span><span class="pill hot">15s</span><span class="pill">30s</span><span class="pill">60s</span><span class="pill">120s</span>
          </div>
          <div class="sect">Walk mode</div>
          <div class="row"><div class="t"><b>Read responses aloud</b><span>Speak new agent output once it goes quiet</span></div><i class="sw on"></i></div>
          <div class="row"><div class="t"><b>Send dictation automatically</b><span>Press Enter after the dictated text</span></div><i class="sw on"></i></div>
          <div class="sect">Voice</div>
          <div class="row"><div class="t"><b>Speech engine</b><span>Engine default</span></div></div>
          <div class="row"><div class="t"><b>Voice</b><span>Phone default</span></div></div>
          <div class="pad" style="padding:4px 14px 8px;display:flex;gap:6px;flex-wrap:wrap">
            <span class="pill">0.8x</span><span class="pill hot">1.2x</span><span class="pill">1.5x</span><span class="pill">2.0x</span>
          </div>
          <div class="row"><div class="t"><b>Dictation recognizer</b><span>Phone default (on-device if available)</span></div></div>
          <div class="row"><div class="t"><b>Dictation language</b><span>English (United States) · installed</span></div></div>
          <div class="row"><div class="t"><b>Deutsch</b><span>not installed</span></div><span class="pill">Download</span></div>
          <div class="sect">Backup</div>
          <div class="row"><div class="t"><b>Export config</b><span>Hosts, projects, workspaces, agent presets and settings. No keys.</span></div><span class="pill">Export</span></div>
          <div class="row"><div class="t"><b>Import config</b><span>Adds what is missing; existing names are kept.</span></div><span class="pill">Import</span></div>
          <div class="sect">Background</div>
          <div class="row"><div class="t"><b>Battery optimisation</b><span class="ok">Unrestricted — monitoring can run while the screen is off</span></div></div>
        </div>
        <div class="nav"><div>Projects</div><div>Hosts</div><div class="sel">Settings</div></div>
      </div>
    </figure>

    <!-- Import summary -->
    <figure class="phone">
      <figcaption class="cap">Import summary</figcaption>
      <div class="screen">
        <div class="status"><span>9:41</span><span>◗◗ ◗ ▮</span></div>
        <div class="pad">
          <div class="notif">
            <div class="top">Config imported</div>
            <div class="app">Hosts: 2 added · 1 already present</div>
            <div class="msg">Workspaces: 3 added, 1 skipped<br>Projects: 1 added · Agent presets: 0 added</div>
          </div>
          <div class="notif">
            <div class="top">Authorize this phone on</div>
            <div class="app">home-server, build-box</div>
            <div class="msg">Open each host under Hosts and copy its command, or tap Test connection to check.</div>
          </div>
        </div>
        <div class="btn" style="margin-top:auto">OK</div>
      </div>
    </figure>

    <!-- Workspace editor -->
    <figure class="phone">
      <figcaption class="cap">Workspace editor</figcaption>
      <div class="screen">
        <div class="status"><span>9:41</span><span>◗◗ ◗ ▮</span></div>
        <div class="bar"><span class="mut">← New workspace</span><span></span></div>
        <div class="pad">
          <div class="field"><span>Name</span><b>TollBff</b></div>
          <div class="field"><span>Project</span><b>Work</b></div>
          <div class="field"><span>Host</span><b>home-server ▾</b></div>
          <div class="field"><span>Directory</span><span class="v">~/src/tollbff</span></div>
          <div class="field"><span>Agent</span><b>claude ▾</b></div>
          <div class="field"><span>Args</span><b>—</b></div>
        </div>
        <div class="btn">Save</div>
      </div>
    </figure>

    <!-- Notifications -->
    <figure class="phone">
      <figcaption class="cap">Notifications</figcaption>
      <div class="screen">
        <div class="status"><span>9:41</span><span>◗◗ ◗ ▮</span></div>
        <div class="pad">
          <div class="notif">
            <div class="top">Agent alerts</div>
            <div class="app">Work · TollBff · Fix flaky test</div>
            <div class="msg">No output for 15s — may be waiting for input</div>
          </div>
          <div class="notif">
            <div class="top">Connection status</div>
            <div class="app">home-server</div>
            <div class="msg">Connection lost — reconnecting…</div>
          </div>
          <div class="notif">
            <div class="top">Connection status</div>
            <div class="app">home-server</div>
            <div class="msg">Monitoring paused — tap to resume</div>
          </div>
        </div>
      </div>
    </figure>

  </div>
</body>
</html>
